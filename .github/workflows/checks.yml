name: Validate portfolio
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python portfolio.py build reviews
      - run: python portfolio.py build meeting
      - run: python portfolio.py build security
      - run: python portfolio.py validate reviews projects/reviews/reference.json
      - run: python portfolio.py validate meeting projects/meeting/reference.json
      - run: python portfolio.py validate security projects/security/reference.json
